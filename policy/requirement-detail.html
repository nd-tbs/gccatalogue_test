.nav-actions { display: flex; flex-direction: column; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 4px; font-size: 0.88rem; font-weight: 600; text-decoration: none; border: none; cursor: pointer; font-family: inherit; justify-content: center; }
.btn-primary { background: #26374a; color: #fff; }

.btn-secondary { background: #fff; color: #26374a; border: 1px solid #26374a; }

/* ── Helpers ── */
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getParam(name) {
  var params = new URLSearchParams(window.location.search);
  return params.get(name) || '';
}

/* Returns direct child clauses of a given parent clause */
function getChildren(parentClause, instrument) {
  var parts = parentClause.split('.');
  return requirements.filter(function(r) {
    if (r.clause === parentClause) return false;
    if (r.instrument !== instrument) return false;
    var rParts = r.clause.split('.');
    if (rParts.length !== parts.length + 1) return false;
    for (var i = 0; i < parts.length; i++) {
      if (rParts[i] !== parts[i]) return false;
    }
    return true;
  });
}

/* Returns sibling requirements (same role + topic, different clause) */
function getRelated(req, limit) {
  return requirements.filter(function(r) {
    return r.clause !== req.clause &&
           r.instrument === req.instrument &&
           (r.role === req.role || r.topic === req.topic);
  }).slice(0, limit || 4);
}

/* Navigate to prev/next in the full list */
function getSiblingIndex(idx, delta) {
  var next = idx + delta;
  if (next < 0 || next >= requirements.length) return null;
  return next;
}

function buildDetailURL(r) {
  return 'requirement-detail.html?clause=' + encodeURIComponent(r.clause) +
         '&instrument=' + encodeURIComponent(r.instrument);
}

/* ── Main render ── */
document.addEventListener('DOMContentLoaded', function() {
  var clauseParam     = getParam('clause');
  var instrumentParam = getParam('instrument');

  /* Find the matching requirement */
  var idx = -1;
  var req = null;
  for (var i = 0; i < requirements.length; i++) {
    if (requirements[i].clause === clauseParam &&
        requirements[i].instrument === instrumentParam) {
      idx = i;
      req = requirements[i];
      break;
    }
  }

  if (!req) {
    document.getElementById('not-found').style.display = 'block';
    document.getElementById('breadcrumb-clause').textContent = 'Not found';
    document.title = 'Not found — PSD & DSD Requirements';
    return;
  }

  document.title = 'Clause ' + req.clause + ' — PSD & DSD Requirements';

  /* ── Breadcrumb ── */
  document.getElementById('breadcrumb-clause').textContent = 'Clause ' + req.clause;

  /* ── Hero ── */
  var instrClass = req.instrument.indexOf('Directive') !== -1 ? 'badge-dsd' : 'badge-psd';
  document.getElementById('hero-content').innerHTML =
    '<div class="clause-row">' +
      '<span class="clause-tag">Clause ' + esc(req.clause) + '</span>' +
      '<span class="instr-tag ' + instrClass + '">' + esc(req.instrument) + '</span>' +
    '</div>' +
    '<h1>' + esc(req.req) + '</h1>';

  /* ── Sub-requirements ── */
  var children = getChildren(req.clause, req.instrument);
  var subHtml = '';
  if (children.length > 0) {
    subHtml =
      '<div class="sub-reqs">' +
        '<h2>Sub-requirements</h2>' +
        '<div class="sub-req-list">';
    children.forEach(function(c) {
      subHtml +=
        '<div class="sub-req-item">' +
          '<span class="sub-clause">' + esc(c.clause) + '</span>' +
          '<p>' + esc(c.req) + '</p>' +
        '</div>';
    });
    subHtml += '</div></div>';
  }

  /* ── Related requirements ── */
  var related = getRelated(req, 4);
  var relatedHtml = '';
  if (related.length > 0) {
    relatedHtml = '<div class="related-section"><h2>Related requirements</h2><div class="related-list">';
    related.forEach(function(r) {
      var rClass = r.instrument.indexOf('Directive') !== -1 ? 'badge-dsd' : 'badge-psd';
      relatedHtml +=
        '<a class="related-card" href="' + buildDetailURL(r) + '">' +
          '<div class="r-top">' +
            '<span class="r-clause">Clause ' + esc(r.clause) + '</span>' +
          '</div>' +
          '<p>' + esc(r.req) + '</p>' +
          '<span class="r-role">' + esc(r.role) + '</span>' +
        '</a>';
    });
    relatedHtml += '</div></div>';
  }

  document.getElementById('detail-body').innerHTML =
    '<p class="section-label">Requirement text</p>' +
    '<p class="detail-req-text">' + esc(req.req) + '</p>' +
    subHtml +
    relatedHtml;

  /* ── Sidebar ── */
  var prevIdx = getSiblingIndex(idx, -1);
  var nextIdx = getSiblingIndex(idx, 1);

  var prevBtn = prevIdx !== null
    ? '<a class="btn btn-ghost" href="' + buildDetailURL(requirements[prevIdx]) + '">' +
        '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg>' +
        'Previous' +
      '</a>'
    : '<button class="btn btn-ghost" disabled style="opacity:.4;cursor:default">' +
        '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg>' +
        'Previous' +
      '</button>';

  var nextBtn = nextIdx !== null
    ? '<a class="btn btn-ghost" href="' + buildDetailURL(requirements[nextIdx]) + '">' +
        'Next' +
        '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg>' +
      '</a>'
    : '<button class="btn btn-ghost" disabled style="opacity:.4;cursor:default">' +
        'Next' +
        '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg>' +
      '</button>';

  document.getElementById('detail-sidebar').innerHTML =
    '<div class="sidebar-card">' +
      '<h3>Metadata</h3>' +
      '<div class="meta-row"><div class="meta-label">Role</div><div class="meta-value"><span class="meta-tag">' + esc(req.role) + '</span></div></div>' +
      '<div class="meta-row"><div class="meta-label">Topic</div><div class="meta-value"><span class="meta-tag">' + esc(req.topic) + '</span></div></div>' +
      '<div class="meta-row"><div class="meta-label">Principle</div><div class="meta-value">' + esc(req.principle) + '</div></div>' +
      '<div class="meta-row"><div class="meta-label">Key Result</div><div class="meta-value" style="font-size:0.83rem;color:#555;">' + esc(req.kr) + '</div></div>' +
    '</div>' +
    '<div class="sidebar-card">' +
      '<h3>Navigation</h3>' +
      '<div class="nav-actions">' +
        '<a class="btn btn-primary" href="draftdemo.html">← All requirements</a>' +
        prevBtn +
        nextBtn +
      '</div>' +
    '</div>';

  document.getElementById('detail-layout').style.display = 'grid';
});
</script>
